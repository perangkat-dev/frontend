<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamu Script Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Jamu Script Manager</h1>
            <span class="version">v2.0.0</span>
        </header>

        <!-- Upload Section -->
        <section class="upload-section">
            <button id="uploadButton" class="btn btn-primary">
                <span class="icon"></span> Upload Script
            </button>
        </section>

        <!-- Script List Section -->
        <section class="script-list-section">
            <div class="section-header">
                <h2>Installed Scripts</h2>
                <span id="scriptCount" class="count">0</span>
            </div>
            <div id="scriptList" class="script-list">
                <!-- Scripts will be injected here by JS -->
            </div>
        </section>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"></div>
            <h3>Delete Script</h3>
            <p id="deleteMessage">Are you sure you want to delete this script?</p>
            <div class="modal-actions">
                <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
